<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><style>
.in,.fa,.fb,.fc,.tw,.tw2,.pl,.bob,.ml,.ml2,.ml3{transform-box:fill-box;transform-origin:center}
.in{animation:rise .9s cubic-bezier(.45,0,.55,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}.d5{animation-delay:.6s}
.fa{animation:fl 3.4s cubic-bezier(.45,0,.55,1) infinite alternate}
.fb{animation:fl 4.2s cubic-bezier(.45,0,.55,1) .6s infinite alternate}
.fc{animation:fl2 3.8s cubic-bezier(.45,0,.55,1) .3s infinite alternate}
.tw{animation:tw 2.8s cubic-bezier(.45,0,.55,1) infinite}
.tw2{animation:tw 3.4s cubic-bezier(.45,0,.55,1) 1.2s infinite}
.pl{animation:pl 2.6s cubic-bezier(.45,0,.55,1) 1s infinite}
.bob{animation:bob 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
.ml{animation:ml 1.6s cubic-bezier(.45,0,.55,1) infinite}
.ml2{animation:ml 1.6s cubic-bezier(.45,0,.55,1) .25s infinite}
.ml3{animation:ml 1.6s cubic-bezier(.45,0,.55,1) .5s infinite}
.spin{animation:spin 6s linear infinite}
.dash{animation:dash 1.4s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes fl2{from{transform:translateY(0) rotate(0)}to{transform:translateY(-6px) rotate(-3deg)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes ml{0%{opacity:0;transform:translateX(14px)}40%{opacity:1}100%{opacity:0;transform:translateX(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4B286E" flood-opacity=".16"/></filter>
<filter id="sh2" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4B286E" flood-opacity=".22"/></filter>
<linearGradient id="dr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B4BB0"/><stop offset="1" stop-color="#5A3389"/></linearGradient>
<linearGradient id="cd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B4BB0"/><stop offset="1" stop-color="#4E2C78"/></linearGradient>
<clipPath id="m"><rect x="28" y="28" width="250" height="244" rx="24"/></clipPath></defs>
<g class="in">
<g filter="url(#sh)"><rect x="28" y="28" width="250" height="244" rx="24" fill="#F7F2FA"/></g>
<g clip-path="url(#m)">
<rect x="150" y="40" width="80" height="60" rx="10" fill="#DDEFE6"/><circle cx="182" cy="70" r="9" fill="#BFE0CF"/><circle cx="204" cy="62" r="7" fill="#BFE0CF"/>
<g fill="#EDE3F3"><rect x="40" y="40" width="90" height="60" rx="8"/><rect x="40" y="120" width="60" height="70" rx="8"/><rect x="120" y="120" width="70" height="70" rx="8"/><rect x="210" y="120" width="60" height="50" rx="8"/><rect x="40" y="210" width="110" height="60" rx="8"/><rect x="170" y="210" width="100" height="60" rx="8"/></g>
<g stroke="#fff" stroke-width="12" stroke-linecap="round"><path d="M20 110 H290"/><path d="M20 200 H290"/><path d="M110 20 V290"/><path d="M200 110 V290"/><path d="M240 20 V110"/></g>
<path class="dash" d="M70 250 V200 H200 V110 H240 V82" stroke="#6B3F9E" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 11"/>
</g>
<circle cx="70" cy="250" r="9" fill="#fff"/><circle cx="70" cy="250" r="5" fill="#6B3F9E"/>
<g>
<animateMotion path="M70 250 V200 H200 V110 H240 V82" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.8;1" keyPoints="0;1;1" keySplines=".45 0 .55 1;0 0 1 1"/>
<g filter="url(#sh2)"><circle cx="0" cy="0" r="17" fill="#fff"/></g>
<path d="M-10 4 v-5 l3 -6 h14 l3 6 v5 Z" fill="#6B3F9E"/><rect x="-6" y="-6" width="12" height="4" rx="1" fill="#E9DAF5"/>
<circle cx="-6" cy="5" r="2.6" fill="#2F1B42"/><circle cx="6" cy="5" r="2.6" fill="#2F1B42"/>
</g>
</g>
<g class="in d2"><g class="fa"><g filter="url(#sh2)"><path d="M240 76 c-14 -16 -20 -24 -20 -34 a20 20 0 0 1 40 0 c0 10 -6 18 -20 34Z" fill="#6B3F9E"/></g>
<path d="M231 44 l9 -8 9 8 v9 h-18 Z" fill="#fff"/><rect x="237" y="46" width="6" height="7" fill="#6B3F9E"/></g></g>
<g class="in d1"><g class="fb"><g filter="url(#sh2)"><rect x="42" y="42" width="90" height="34" rx="17" fill="#fff"/></g>
<circle class="pl" cx="60" cy="59" r="7" fill="#7FB59B"/><rect x="74" y="54" width="46" height="10" rx="5" fill="#3E2352"/></g></g>
<g class="in d3"><g class="fc"><g transform="translate(-12 0) rotate(-8 318 200)">
<g filter="url(#sh)"><rect x="244" y="150" width="140" height="92" rx="16" fill="url(#cd)"/></g>
<rect x="260" y="170" width="24" height="18" rx="4" fill="#E0B653"/><path d="M260 179 h24 M272 170 v18" stroke="#B08C45" stroke-width="1.2"/>
<rect x="260" y="202" width="86" height="7" rx="3.5" fill="#fff" opacity=".85"/><rect x="260" y="218" width="44" height="6" rx="3" fill="#fff" opacity=".5"/>
<circle cx="352" cy="222" r="9" fill="#D7A7C6" opacity=".9"/><circle cx="364" cy="222" r="9" fill="#E0B653" opacity=".9"/>
</g></g></g>
<g class="in d4"><g class="pl"><g filter="url(#sh2)"><circle cx="366" cy="142" r="20" fill="#fff"/></g>
<rect x="357" y="141" width="18" height="14" rx="3" fill="#6B3F9E"/><path d="M360.5 141 v-4 a5.5 5.5 0 0 1 11 0 v4" stroke="#6B3F9E" stroke-width="3" fill="none"/><circle cx="366" cy="148" r="2" fill="#fff"/></g></g>
<g class="in d5"><path class="tw" d="M330 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z" fill="#C9A45C"/></g>
<g class="in d5"><path class="tw2" d="M300 100 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2Z" fill="#D7A7C6"/></g>
</svg>