<circle cx="195" cy="106" r="1.6" fill="#2F1B42"/><circle cx="205" cy="106" r="1.6" fill="#2F1B42"/>
<path d="M195.5 113 Q200 116.5 204.5 113" stroke="#B5746A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</g>
<rect x="160" y="164" width="80" height="10" rx="5" fill="#3E2352"/><rect x="172" y="182" width="56" height="7" rx="3.5" fill="#D9C4EC"/>
<g fill="#E0B653">
<path id="st" d="M0 -7 l2.1 4.3 4.7 .7 -3.4 3.3 .8 4.7 -4.2 -2.2 -4.2 2.2 .8 -4.7 -3.4 -3.3 4.7 -.7Z" transform="translate(164 208)"/>
<use href="#st" transform="translate(18 0)"/><use href="#st" transform="translate(36 0)"/><use href="#st" transform="translate(54 0)"/><use href="#st" transform="translate(72 0)"/>
</g>
