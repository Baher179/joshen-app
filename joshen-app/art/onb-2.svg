</g>
<g class="in d3"><g class="pl"><g filter="url(#sh2)"><path d="M240 118 l18 6 v12 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 v-12 Z" fill="#6B3F9E" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
