<rect x="327" y="92" width="6" height="26" rx="3" fill="#6B3F9E"/><rect x="326" y="82" width="8" height="11" rx="1.5" fill="#C9A45C"/>
<path d="M326 83 C322 74 325 64 330 60 C335 64 338 74 334 83 Z" fill="#D7A7C6"/></g></g></g>
<g class="in d4"><g class="fb"><g filter="url(#sh)"><circle cx="318" cy="196" r="24" fill="#fff"/></g>
<rect x="311" y="194" width="14" height="16" rx="4" fill="#D7A7C6"/><rect x="314" y="182" width="8" height="13" rx="2" fill="#6B3F9E"/></g></g>
<g class="in d1">
<g filter="url(#sh)"><rect x="120" y="34" width="160" height="236" rx="24" fill="#fff"/></g>
<circle cx="200" cy="100" r="46" fill="url(#av)"/>
