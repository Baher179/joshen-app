<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><style>
.in,.fa,.fb,.fc,.tw,.tw2,.pl,.bob,.ml,.ml2,.ml3{transform-box:fill-box;transform-origin:center}
.in{animation:rise .9s cubic-bezier(.45,0,.55,1) both}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}.d4{animation-delay:.48s}.d5{animation-delay:.6s}
.fa{animation:fl 3.4s cubic-bezier(.45,0,.55,1) infinite alternate}
.fb{animation:fl 4.2s cubic-bezier(.45,0,.55,1) .6s infinite alternate}
.fc{animation:fl2 3.8s cubic-bezier(.45,0,.55,1) .3s infinite alternate}
.tw{animation:tw 2.8s cubic-bezier(.45,0,.55,1) infinite}
.tw2{animation:tw 3.4s cubic-bezier(.45,0,.55,1) 1.2s infinite}
.pl{animation:pl 2.6s cubic-bezier(.45,0,.55,1) 1s infinite}
.bob{animation:bob 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
.ml{animation:ml 1.6s cubic-bezier(.45,0,.55,1) infinite}
.ml2{animation:ml 1.6s cubic-bezier(.45,0,.55,1) .25s infinite}
.ml3{animation:ml 1.6s cubic-bezier(.45,0,.55,1) .5s infinite}
.spin{animation:spin 6s linear infinite}
.dash{animation:dash 1.4s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes fl2{from{transform:translateY(0) rotate(0)}to{transform:translateY(-6px) rotate(-3deg)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes ml{0%{opacity:0;transform:translateX(14px)}40%{opacity:1}100%{opacity:0;transform:translateX(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
